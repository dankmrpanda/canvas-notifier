version: '3.8'

services:
  canvas-notifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canvas-notifier
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    volumes:
      # Persist assignment/reminder data to local project folders
      - ./courses:/app/courses
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
